# Netlify Static Frontend Configuration for Study Buddy AI
# Backend API runs independently as a Render Web Service.
# Set VITE_API_BASE_URL=https://<your-render-service>.onrender.com in Netlify Environment Variables
# (or optionally replace the commented proxy redirect below with your live Render URL).

[build]
  command = "npm run build"
  publish = "dist"

# Optional same-origin reverse proxy if you prefer relative /api/* requests through Netlify:
# [[redirects]]
#   from = "/api/*"
#   to = "https://study-buddy-ai-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single-Page Application fallback for React routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
